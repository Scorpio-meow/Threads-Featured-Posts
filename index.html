<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="以更精緻的版面瀏覽 Threads 精選貼文、快速分頁與即時嵌入內容。">
    <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)">
    <title>Threads 精選貼文</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Threads 精選">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css?v=4">
    <script src="console-filter.js"></script>
</head>

<body>
    <div class="page-shell">
        <header class="page-header">
            <div class="brand-lockup">
                <span class="brand-mark" aria-hidden="true">
                    <img src="assets/icons/favicon-192x192.png" alt="" draggable="false">
                </span>
                <div class="brand-copy">
                    <p class="page-eyebrow">Threads Featured Posts</p>
                    <h1>Threads 精選貼文</h1>
                </div>
        </header>
        <section class="control-bar" aria-label="控制與篩選面板">
            <div class="control-bar__search">
                <input type="search" id="search-input" placeholder="搜尋作者、內文或標籤..." aria-label="搜尋貼文">
                <button id="search-submit" class="search-submit-btn" aria-label="執行搜尋" title="搜尋">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
            <div class="control-bar__actions">
                <button id="theme-toggle" class="control-btn theme-toggle-btn" aria-label="切換深淺色主題" title="切換主題">
                    <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <button id="layout-toggle" class="control-btn layout-toggle-btn" aria-label="切換版面配置" title="切換版面">
                    <svg class="grid-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <svg class="list-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                </button>
            </div>
        </section>
        <div id="tags-filter-bar" class="tags-filter-bar" aria-label="熱門標籤篩選">
            <div id="tags-container" class="tags-container"></div>
        </div>
        <nav class="pagination-wrapper pagination-wrapper--top" aria-label="頂部分頁導航">
            <div class="page-info" aria-live="polite"></div>
            <div class="pagination" role="navigation" aria-label="分頁"></div>
        </nav>
        <main id="posts-container" data-posts-container aria-live="polite" aria-busy="false"
            aria-label="Threads 精選貼文列表">
        </main>
        <nav class="pagination-wrapper pagination-wrapper--bottom" aria-label="底部分頁導航">
            <div class="page-info" aria-hidden="true"></div>
            <div class="pagination" role="navigation" aria-label="分頁"></div>
        </nav>
    </div>
    <script src="config.js"></script>
    <script src="threads-loader.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then((reg) => console.log('[Service Worker] 註冊成功，Scope:', reg.scope))
                    .catch((err) => console.error('[Service Worker] 註冊失敗:', err));
            });
        }
    </script>
</body>

</html>
